# 构建期注入的构建日期（横幅「🔷 重制版构建日期」那一行的唯一来源）。
#
# 🔴 下面那一行的值是个【占位符】，由 build.gradle 的 processResources -> expand 在构建时
#    替换成构建当天的 yyyy-MM-dd（本机时区）。
# 🔴 本文件路径【必须】出现在 processResources 的 filesMatching 列表里，
#    否则占位符会以原文进 jar（Java 侧会为此显示「(不可用)」，不会回落）。
# 🔴 这里【不许】出现写死的日期。改日期请改 build.gradle 的 buildDate，或改系统时钟。
# 键值保持纯 ASCII：java.util.Properties 按 ISO-8859-1 读（注释不受影响）。
build_date=${build_date}
