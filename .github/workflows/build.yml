name: Build GTSH (Push)

on:
  push:
    branches: ['**']
  # A fork's push is not a push to this repository.
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    # Same-repository PR commits already build on push. Keep CI for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out GTSH
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: GTSH
          persist-credentials: false

      - name: Check out compatible SH-Better-UI
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dishanhai/SH-Better-UI
          ref: d91e3bd8feb67b2ca9be96ec3446193779ccaaee
          path: SH-Better-UI
          persist-credentials: false

      - name: Check out compatible SH-Common-Lib
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dishanhai/SH-Common-Lib
          ref: b02c6c06db3a61f213d9abc463f2eae1f16f596a
          path: SH-Common-Lib
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install verified Gradle 8.8
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.8-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.8-bin.zip"
          printf '%s  %s\n' a4b4158601f8636cdeeab09bd76afb640030bb5b144aafe261a5e8af027dc612 \
            "$RUNNER_TEMP/gradle-8.8-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle-8.8-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.8/bin" >> "$GITHUB_PATH"

      - name: Build the Forge mod and verify the runtime JAR
        run: bash GTSH/.github/build-forge.sh

      - name: Upload Forge mod JAR
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gt-shanhai-forge-1.20.1
          path: GTSH/build/ci-artifacts/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Run GTSH regression tests
        id: regression
        working-directory: GTSH
        run: gradle --no-daemon --console=plain check

      - name: Upload failed regression report
        if: failure() && steps.regression.conclusion == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gt-shanhai-regression-report
          path: |
            GTSH/build/reports/tests/
            GTSH/build/test-results/
          if-no-files-found: warn
          retention-days: 14
