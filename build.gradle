plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    // 与 libs/kotlinforforge-4.12.0-all.jar 内的 stdlib 2.2.21 对齐
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
}

version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Kotlin 编译目标与 Java toolchain 对齐（Java 21）
// 注意：Mixin 的 annotationProcessor 只作用于 Java；若要用 Kotlin 写 @Mixin，需要额外接入 kapt（当前未启用）
// 2.2 起接口默认方法已是编译器默认行为，不再传 -Xjvm-default
kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

base {
    archivesName = mod_id
}

sourceSets.main.resources { setSrcDirs(['src/main/resources', 'src/generated/resources']) }

repositories {
    mavenCentral()
    mavenLocal {
        content { includeModule 'com.dishanhai', 'sh-common-lib-forge-1.20.1' }
    }
    // 山海：讓 ForgeGradle 對本機可選 API／測試依賴執行 SRG → 開發映射。
    flatDir { dirs 'libs' }
}

// 山海：独立 UI 库的开发产物；正式游戏需单独安装发行 jar。
def shBetterUiJar = file(findProperty('shBetterUiJar') ?: "../SH-Better-UI/build/libs/sh_better_ui-${sh_better_ui_version}-dev.jar")

dependencies {
    implementation files(shBetterUiJar)
    implementation fg.deobf("com.dishanhai:sh-common-lib-forge-1.20.1:${sh_common_lib_version}")
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 核心 Kotlin：只认这颗 jar（stdlib 2.2.21）。不要再依赖插件自带的 kotlin-stdlib。
    // 类不能解进 mod 根目录，否则和 thedarkcolour.kotlinforforge 抢 kotlin.* 导出。
    // 运行时整包放进 META-INF/jarjar，让 Forge 在 gtladditions 自带的 4.11 和本包 4.12 之间选 4.12。
    def kotlinForForge = files('libs/kotlinforforge-4.12.0-all.jar')
    implementation kotlinForForge

    implementation fileTree(dir: 'libs', include: '*.jar',
            excludes: ['sh_better_ui-*.jar', 'spark-*.jar', 'jei-*.jar', '*gtlcore-1.2.3.2-fix3.jar', 'kotlinforforge-*.jar', 'GTL-Enhancedcore-*.jar'])
    testImplementation(fg.deobf('local:appliedenergistics2-forge:15.4.10')) { transitive = false }
    implementation files('libs/gtlcore-1.2.3.2-fix4.jar')
    implementation files('libs/jei-1.20.1-forge-15.49.0.200.jar')
    testImplementation files('libs/jei-1.20.1-forge-15.49.0.200.jar')
    compileOnly fileTree(dir: 'libs', include: 'spark-*.jar')
    implementation files('D:/minecraft/gtl/.minecraft/versions/八周目/.minecraft/versions/GTL九周目/.minecraft/versions/GTL九周目/mods/ftb-quests-forge-2001.4.22.jar')
    implementation files('D:/minecraft/gtl/.minecraft/versions/八周目/.minecraft/versions/GTL九周目/.minecraft/versions/GTL九周目/mods/ftb-teams-forge-2001.3.2.jar')
    // cloth-config：模组列表「配置」按钮的 GUI（运行期整合包已提供，仅编译期引用）
    compileOnly files('D:/minecraft/gtl/.minecraft/versions/八周目/.minecraft/versions/GTL九周目/.minecraft/versions/GTL九周目/mods/cloth-config-11.1.136-forge.jar')
    compileOnly files('D:/minecraft/gtl/.minecraft/versions/八周目/.minecraft/versions/GTL九周目/.minecraft/versions/GTL九周目/mods/ae2wtlib-15.3.3-forge.jar')


    implementation 'io.github.llamalad7:mixinextras-common:0.5.0-beta.2'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0-beta.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // 主模組既有 AE2 file 依賴保留；單測使用同一原件的映射副本以執行 NBT 方法。
    classpath = classpath.filter { it.name != 'appliedenergistics2-forge-15.4.10.jar' }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:-processing', '-Xlint:-deprecation', '-Xlint:-removal']
}

// ForgeGradle 在 afterEvaluate 會連 piston-meta.mojang.com 取 asset index。
// 連線逾時只印堆疊，建置仍會繼續，但每次白等約半分鐘。
// 本機 forge_gradle 快取已有這份 1.20.1 version.json，先放到 downloadMCMeta 的輸出路徑即可跳過網路。
def cachedMcVersionJson = file("${System.properties['user.home']}/.gradle/caches/forge_gradle/minecraft_repo/versions/${minecraft_version}/version.json")
def mcMetaOut = layout.buildDirectory.file('downloadMCMeta/version.json').get().asFile
if (cachedMcVersionJson.isFile() && !mcMetaOut.isFile()) {
    mcMetaOut.parentFile.mkdirs()
    java.nio.file.Files.copy(cachedMcVersionJson.toPath(), mcMetaOut.toPath())
}

minecraft {
    mappings channel: mappings_channel, version: "${mappings_version}-${minecraft_version}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory file('run')
            property 'forge.logging.console.level', 'debug'
            mods { gt_shanhai { source sourceSets.main } }
        }
        server {
            workingDirectory file('run')
            property 'forge.logging.console.level', 'debug'
            mods { gt_shanhai { source sourceSets.main } }
        }
    }
}

processResources {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            minecraft_version: minecraft_version, forge_version: forge_version,
            sh_better_ui_version: sh_better_ui_version,
            sh_common_lib_version: sh_common_lib_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
        filteringCharset = 'UTF-8'
    }
    filesMatching(['pack.mcmeta']) { filteringCharset = 'UTF-8' }
}

def kotlinForForgeJar = file('libs/kotlinforforge-4.12.0-all.jar')
def kotlinForForgeMetadata = layout.buildDirectory.file('generated/jarjar/metadata.json')

tasks.register('writeKotlinForForgeMetadata') {
    outputs.file(kotlinForForgeMetadata)
    doLast {
        def metadata = kotlinForForgeMetadata.get().asFile
        metadata.parentFile.mkdirs()
        metadata.setText('''{
  "jars": [
    {
      "identifier": {
        "group": "thedarkcolour",
        "artifact": "kotlinforforge"
      },
      "version": {
        "range": "[4.12.0,5.0.0)",
        "artifactVersion": "4.12.0"
      },
      "path": "META-INF/jarjar/kotlinforforge-4.12.0-all.jar"
    }
  ]
}
''', 'UTF-8')
    }
}

// 山海：防止共用classes目錄被其他編譯清理後，jar只封入部分類別仍顯示成功。
def verifyShanhaiJarClasses = { File artifact ->
    def required = new LinkedHashSet<String>()
    sourceSets.main.allJava.files.each { source ->
        if (source.name == 'package-info.java' || source.name == 'module-info.java') return
        def packageName = source.getText('UTF-8') =~ /(?m)^\s*package\s+([\w.]+)\s*;/
        if (packageName.find()) {
            required.add(packageName.group(1).replace('.', '/') + '/' + source.name.replaceFirst(/\.java$/, '.class'))
        }
    }
    def zip = new java.util.zip.ZipFile(artifact)
    try {
        def configs = zip.entries().findAll { it.name.endsWith('.mixin.json') }
        configs.each { entry ->
            def config
            zip.getInputStream(entry).withCloseable { input -> config = new groovy.json.JsonSlurper().parse(input, 'UTF-8') }
            if (config.plugin) required.add(config.plugin.replace('.', '/') + '.class')
            ['mixins', 'client', 'server'].each { side ->
                (config[side] ?: []).each { mixin ->
                    required.add((config.package + '.' + mixin).replace('.', '/') + '.class')
                }
            }
        }
        def missing = required.findAll { zip.getEntry(it) == null }
        if (!missing.isEmpty()) {
            throw new GradleException('山海jar缺少必要主程式／Mixin類別（' + missing.size()
                    + '項），禁止發布不完整封包。請使用隔離build目錄完整重建。例如: ' + missing.take(12))
        }
        logger.lifecycle('山海jar完整性通過：{}個必要主程式／Mixin類別，{}個Mixin設定', required.size(), configs.size())
    } finally {
        zip.close()
    }
}

tasks.register('verifyModJar') {
    group = 'verification'
    description = '山海：檢查現有jar的主程式、Mixin與插件類別是否完整。'
    doLast {
        def requested = project.findProperty('shanhaiVerifyJar')
        verifyShanhaiJarClasses(requested ? project.file(requested) : tasks.named('jar').get().archiveFile.get().asFile)
    }
}

jar {
    archiveClassifier = 'raw'
    finalizedBy 'reobfJar'
    dependsOn 'writeKotlinForForgeMetadata'
    from(kotlinForForgeJar) {
        into 'META-INF/jarjar'
    }
    from(kotlinForForgeMetadata) {
        into 'META-INF/jarjar'
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'gt_shanhai.mixin.json,gt_shanhai.minecraft.mixin.json,gt_shanhai.gtceu.mixin.json,gt_shanhai.gtlcore.mixin.json,gt_shanhai.gtladditions.mixin.json,gt_shanhai.ae2.mixin.json,gt_shanhai.ae2addons.mixin.json,gt_shanhai.jei.mixin.json,gt_shanhai.ftb.mixin.json,gt_shanhai.ldlib.mixin.json,gt_shanhai.guideme.mixin.json,gt_shanhai.optional.mixin.json,gt_shanhai.enhancedcore.mixin.json',
        ])
    }
    doLast {
        def jarFile = archiveFile.get().asFile
        verifyShanhaiJarClasses(jarFile)
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def bad = []
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                def name = entries.nextElement().name
                def leaked = name.startsWith('kotlin/') || name.startsWith('kotlinx/') || name.startsWith('thedarkcolour/kotlinforforge/')
                if (leaked) {
                    bad.add(name)
                }
            }
            if (!bad.isEmpty()) {
                throw new GradleException('mod jar 根上出现了 Kotlin 包，会和 KotlinForForge 抢导出。例如: ' + bad.take(5))
            }
            if (zip.getEntry('META-INF/jarjar/kotlinforforge-4.12.0-all.jar') == null
                    || zip.getEntry('META-INF/jarjar/metadata.json') == null) {
                throw new GradleException('mod jar 缺少 KotlinForForge 4.12 Jar-in-Jar')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('devJar', Jar) {
    dependsOn classes
    archiveClassifier = 'dev'
    from sourceSets.main.output
}

tasks.register('releaseJar', Copy) {
    dependsOn 'reobfJar'
    from layout.buildDirectory.file('reobfJar/output.jar')
    into layout.buildDirectory.dir('libs')
    rename { "${mod_id}-${mod_version}.jar" }
}

tasks.named('build') { dependsOn 'devJar', 'releaseJar' }

