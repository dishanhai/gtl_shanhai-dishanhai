// 山海：防止缺少独立库时产生误导性的下游编译错误。
tasks.register('verifyShBetterUiDependency') {
    doLast {
        if (!shBetterUiJar.isFile()) {
            throw new GradleException('Build SH-Better-UI devJar first or pass -PshBetterUiJar=<dev-jar>.')
        }
        new java.util.zip.ZipFile(shBetterUiJar).withCloseable { jar ->
            def uiPackage = 'com/dishanhai/sh_better_ui/client'
            def required = ['gui/scaled/ThemeEffects', 'gui/scaled/ShapeWaves', 'gui/scaled/VisualReveal', 'gui/display/ElectricLogo',
                            'gui/scaled/UiButton', 'gui/scaled/UiScreenReturn', 'gui/scaled/UiBottomSheet',
                            'gui/search/SearchIndex', 'glass/GlassTheme',
                            'api/BackgroundRegistry', 'api/BackgroundSpec', 'api/BackgroundLayer', 'api/MaterialsApi$ThemeChoice']
            if (required.any { jar.getEntry("${uiPackage}/${it}.class") == null }) {
                throw new GradleException("The shop requires SH-Better-UI ${sh_better_ui_version} with the shared appearance APIs.")
            }
            def kernelPackage = 'com/dishanhai/sh_better_ui/kernel/api'
            if (['UIApis', 'UIModule', 'ScreenService', 'AppearanceService'].any { jar.getEntry("${kernelPackage}/${it}.class") == null }) {
                throw new GradleException("The shop requires the Forge SH-Better-UI ${sh_better_ui_version} dev JAR with Unified UI Kernel.")
            }
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyShBetterUiDependency' }
tasks.named('compileKotlin') { dependsOn 'verifyShBetterUiDependency' }
