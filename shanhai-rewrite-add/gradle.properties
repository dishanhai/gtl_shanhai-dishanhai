# ==========================================================================================
# shanhai_add (Shanhai: Additions) - build properties
# ------------------------------------------------------------------------------------------
# ASCII-ONLY FILE, on purpose: Java .properties are read as ISO-8859-1 (same rule as
# ../shanhai-rewrite/gradle.properties). Chinese display strings live in
# src/main/resources/META-INF/mods.toml (processResources uses filteringCharset=UTF-8).
#
# -Dfile.encoding=UTF-8 is required because build.gradle carries Chinese comments
# (same reason as the body build).
# ==========================================================================================
org.gradle.jvmargs=-Xmx4G -Xms1G -Dfile.encoding=UTF-8 -Dnet.minecraftforge.gradle.check.certs=false
# Same as the body: no resident daemon (this project builds rarely).
org.gradle.daemon=false

minecraft_version=1.20.1
forge_version=47.4.16
mappings_channel=parchment
mappings_version=2023.09.03

mod_id=shanhai_add
mod_name=Shanhai's Personal Goods - Additions
mod_version=0.1.0
mod_authors=Shanhai's Personal Goods Team
mod_description=Shanhai Additions: world clock, gravity, extra guard

# Body version this project compiles against. MUST equal BOTH:
#   - shanhai-rewrite/gradle.properties : mod_version
#   - this file                         : mod_version
# Enforced at build time by the verifyBodyJar task (fail-fast, instead of letting FML
# refuse to load the add jar at runtime because of an unsatisfied versionRange).
body_version=0.1.0
